<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Suprise</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        
    }

    html, body{
        width: 100%;
        height: 100%;
        background-image: linear-gradient(to top, #fad0c4 0%, #ffd1ff 100%);
    }

    .box{
        width: 500px;
        height: 500px;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 1px solid black;
        margin: 50px auto;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        position: relative;
        margin-top: 100px;
    }

    .box img{
        width: 300px;
        height: 300px;
        object-fit: cover;
        border-radius: 10px;
        margin-top: -70px;
    }

    .box span{
        position: absolute;
        bottom: 90px;
        font-size: 30px;
        font-weight: bold;
        color: #333;
    }

    .box button {
        position: absolute;
        bottom: 20px;
        padding: 10px 20px;
        font-size: 18px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .yes-btn{
        left: 30%;
        background-color: #4CAF50;
        color: white;
    }

    .no-btn{
        right: 30%;
        background-color: #f44336;
        color: white;
    }

    .box button:hover{
        transform: scale(1.1);
    }

    .box button a{
        text-decoration: none;
        color: white;
    }
    .box button a:hover{
        text-decoration: underline;
    }
   

    @media (max-width : 700px) {
        .box{
            width: 90%;
            height: 400px;
        }

        .box img{
            width: 250px;
            height: 250px;
        }

        .box span{
            font-size: 20px;
            bottom: 80px;
        }

        .box button{
            font-size: 16px;
            padding: 8px 16px;
        }

       .yes-btn{
        left: 30%;
        background-color: #4CAF50;
        color: white;
       }

    .no-btn{
        right: 30%;
        background-color: #f44336;
        color: white;
       }

       .box button a{
        text-decoration: none;
        color: white;
       }
       .box button a:hover{
        text-decoration: underline;
       }
       .box button:hover{
        transform: scale(1.1);
       }
   
    }
</style>
<body>

    <div class="box">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWzKUf5ZToX7pu7mMbdUBgZmqiPTvMkSl-BcmWHKpT0A&s=10" alt="">

        <span> Aaj tera Birthday hai ?</span>

        <button class="yes-btn"><a href="./yes.html">Ha</a></button>
        <button class="no-btn" ><a href="./no.html">Naa</a> </button>
    </div>



    <script src="./index.js"></script>
</body>
</html>
