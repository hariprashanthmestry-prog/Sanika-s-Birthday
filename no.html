<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhuti ladaki</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        
    }

    html, body{
        width: 100%;
        height: 100%;
        background-image: linear-gradient(to top, #fad0c4 0%, #ffd1ff 100%);
    }

    .box{
        width: 500px;
        height: 500px;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 1px solid black;
        margin: 50px auto;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        position: relative;
        margin-top: 100px;
    }

    .box img{
        width: 300px;
        height: 300px;
        object-fit: cover;
        border-radius: 10px;
        margin-top: -70px;
    }

    .box span{
        position: absolute;
        bottom: 90px;
        font-size: 30px;
        font-weight: bold;
        color: #333;
    }

    .box button {
        position: absolute;
        bottom: 20px;
        padding: 10px 20px;
        font-size: 18px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s ease;
        background-color: #4CAF50;
    }

    .box button a{
         text-decoration: none;
        color: white;
    }
   

    @media (max-width : 700px) {
        .box{
            width: 90%;
            height: 400px;
        }

        .box img{
            width: 250px;
            height: 250px;
        }

        .box span{
            font-size: 20px;
            bottom: 80px;
        }
    }
    </style>
<body>

    <div class="box">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTUALqXGqlvdAN2I874MWqf_TnCEjjnrXazckqs0TvaJw&s=10" alt="">

        <span> Jhuti ladaki</span>

         <button><a href="./index.html">Wapis jaa ke haa dhaba</a></button>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
